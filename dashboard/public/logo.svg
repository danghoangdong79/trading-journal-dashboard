<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f1f35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Stylised "D" letterform -->
  <path d="M160 136 h48 c88 0 152 40 152 120 s-64 120-152 120 h-48 z M208 184 v144 h8 c56 0 96-28 96-72 s-40-72-96-72 z" fill="url(#accent)" opacity="0.95"/>
  <!-- Mini trading candlestick chart inside the D curve -->
  <g opacity="0.85">
    <!-- Candle 1 – green (bullish) -->
    <line x1="296" y1="220" x2="296" y2="310" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
    <rect x="288" y="240" width="16" height="40" rx="3" fill="url(#green)"/>
    <!-- Candle 2 – red (bearish) -->
    <line x1="328" y1="210" x2="328" y2="300" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
    <rect x="320" y="230" width="16" height="35" rx="3" fill="#ef4444"/>
    <!-- Candle 3 – green (bullish) -->
    <line x1="360" y1="200" x2="360" y2="280" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
    <rect x="352" y="215" width="16" height="35" rx="3" fill="url(#green)"/>
  </g>
</svg>